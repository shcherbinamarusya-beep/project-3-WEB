services:
  app:
    build: .
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=sqlite:////app/instance/marvel_quiz.db
      - YANDEX_SKILL_ID=${YANDEX_SKILL_ID}
      - YANDEX_DIALOGS_OAUTH_TOKEN=${YANDEX_DIALOGS_OAUTH_TOKEN}
    networks:
      - dokploy-network
    volumes:
      - db_data:/app/instance
    restart: unless-stopped

volumes:
  db_data:

networks:
  dokploy-network:
    external: true
